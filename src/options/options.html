<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LG Mercari Duplicate Checker</title>

    <link rel="stylesheet" href="options.css" />
  </head>

  <body>
    <main>
      <h1>LG Mercari Duplicate Checker</h1>

      <section>
        <h2>Google Sheets 設定</h2>

        <div>
          <label for="spreadsheet"> スプレッドシートURL または ID </label>

          <input
            id="spreadsheet"
            type="text"
            placeholder="https://docs.google.com/spreadsheets/d/..."
          />
        </div>

        <div>
          <label for="sheet-name"> シート名 </label>

          <input
            id="sheet-name"
            type="text"
            placeholder="2026年 4月　砥石リサーチ"
          />
        </div>

        <button id="save-settings" type="button">設定を保存</button>

        <p id="save-result"></p>
      </section>

      <hr />

      <section>
        <h2>接続確認</h2>

        <button id="auth-test" type="button">Google認証テスト</button>

        <p id="auth-result">未実行</p>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
